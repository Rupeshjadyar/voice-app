<script>
async function handleContactSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('c-btn');
  const success = document.getElementById('c-success');
  const name = document.getElementById('c-name').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const subject = document.getElementById('c-subject').value;
  const message = document.getElementById('c-msg').value.trim();

  btn.disabled = true;
  const origText = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:6px;"></i> Sending...';

  try {
    const fd = new FormData();
    fd.append('name', name);
    fd.append('email', email);
    fd.append('subject', subject);
    fd.append('message', message);

    const res = await fetch('/api/contact', {
      method: 'POST',
      body: fd
    });
    const data = await res.json();

    if (data.success) {
      btn.style.display = 'none';
      success.style.display = 'block';
      document.getElementById('contact-form').reset();
    } else {
      alert(data.error || 'Failed to send message. Please try again or email us directly.');
      btn.disabled = false;
      btn.innerHTML = origText;
    }
  } catch (err) {
    console.error('Contact error:', err);
    alert('Network error. Please email us directly at rupeshjadyar21@gmail.com');
    btn.disabled = false;
    btn.innerHTML = origText;
  }
}
</script>

<script>
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const target = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', target);
  localStorage.setItem('theme', target);
  updateThemeIcons();
}

function updateThemeIcons() {
  const theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  const btnMob = document.getElementById('theme-btn-mob');
  const iconClass = theme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
  if (btn) btn.innerHTML = '<i class="' + iconClass + '"></i>';
  if (btnMob) btnMob.innerHTML = '<i class="' + iconClass + '"></i>Toggle Theme';
}

document.addEventListener('DOMContentLoaded', () => {
  updateThemeIcons();
});
</script>
